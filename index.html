<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת ניהול ממצאים – Flying Cargo</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('Y8LEsRA7IQa-0Tq8g');</script>
<style>
  :root {
    --primary: #1a3a5c;
    --primary-light: #2e6da4;
    --accent: #e8a020;
    --accent-light: #f5c842;
    --danger: #c0392b;
    --warning: #e67e22;
    --success: #27ae60;
    --info: #2980b9;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a2332;
    --text-light: #5a6a7e;
    --border: #dce3ec;
    --shadow: 0 2px 12px rgba(26,58,92,0.10);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo { display: flex; align-items: center; gap: 12px; }
  .header-logo .logo-icon {
    width: 36px; height: 36px; background: var(--accent);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: var(--primary);
  }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-subtitle { font-size: 12px; opacity: 0.7; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 600;
    transition: all 0.18s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: var(--primary); }
  .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
  .btn-outline { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .btn-outline:hover { background: rgba(255,255,255,0.2); }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-info { background: var(--info); color: white; }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 18px 20px;
    box-shadow: var(--shadow); border-right: 4px solid transparent;
    transition: transform 0.18s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card.open { border-color: var(--danger); }
  .stat-card.in-progress { border-color: var(--warning); }
  .stat-card.closed { border-color: var(--success); }
  .stat-card.total { border-color: var(--primary-light); }
  .stat-num { font-size: 32px; font-weight: 800; line-height: 1; }
  .stat-card.open .stat-num { color: var(--danger); }
  .stat-card.in-progress .stat-num { color: var(--warning); }
  .stat-card.closed .stat-num { color: var(--success); }
  .stat-card.total .stat-num { color: var(--primary); }
  .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; font-weight: 500; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .toolbar-title { font-size: 17px; font-weight: 700; color: var(--primary); flex: 1; }
  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; font-family: 'Heebo', sans-serif; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.15s; color: var(--text-light);
  }
  .filter-btn.active { border-color: var(--primary); background: var(--primary); color: white; }
  .filter-btn:hover:not(.active) { border-color: var(--primary-light); color: var(--primary); }
  .search-box {
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    font-family: 'Heebo', sans-serif; font-size: 14px; width: 220px;
    outline: none; transition: border 0.15s;
  }
  .search-box:focus { border-color: var(--primary-light); }

  /* ── Table ── */
  .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .findings-table { width: 100%; border-collapse: collapse; }
  .findings-table th {
    background: var(--primary); color: white; padding: 12px 16px;
    font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap;
  }
  .findings-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .findings-table tr:last-child td { border-bottom: none; }
  .findings-table tr:hover td { background: #f7faff; }

  /* ── Status Badge ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .badge-open { background: #fdecea; color: var(--danger); }
  .badge-progress { background: #fef3e2; color: var(--warning); }
  .badge-closed { background: #e8f8f0; color: var(--success); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── Severity ── */
  .sev { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
  .sev-1 { background: #e8f8f0; color: var(--success); }
  .sev-2 { background: #fef3e2; color: var(--warning); }
  .sev-3 { background: #fdecea; color: var(--danger); }
  .sev-r { background: #f3e8ff; color: #7c3aed; }

  /* ── Actions ── */
  .actions { display: flex; gap: 6px; }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10,20,40,0.55); z-index: 200;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px; width: 100%; max-width: 640px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: white; z-index: 1;
  }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--primary); }
  .modal-close {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: var(--bg); cursor: pointer; font-size: 18px; color: var(--text-light);
    display: flex; align-items: center; justify-content: center; transition: background 0.15s;
  }
  .modal-close:hover { background: #e0e7ef; }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }

  /* ── Form ── */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .form-control {
    width: 100%; padding: 9px 13px; border-radius: 8px;
    border: 1.5px solid var(--border); font-family: 'Heebo', sans-serif;
    font-size: 14px; outline: none; transition: border 0.15s;
  }
  .form-control:focus { border-color: var(--primary-light); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-info { background: #f0f6ff; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .form-info-row { display: flex; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .form-info-label { font-weight: 600; color: var(--text-light); min-width: 100px; }
  .form-info-val { color: var(--text); }

  /* ── Timeline ── */
  .timeline { margin-top: 4px; }
  .timeline-item {
    display: flex; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
    background: var(--primary-light);
  }
  .timeline-dot.open { background: var(--danger); }
  .timeline-dot.progress { background: var(--warning); }
  .timeline-dot.closed { background: var(--success); }
  .timeline-content { flex: 1; }
  .timeline-status { font-size: 13px; font-weight: 600; }
  .timeline-note { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .timeline-date { font-size: 11px; color: var(--text-light); }

  /* ── New Finding Form ── */
  .recipients-list { display: flex; flex-direction: column; gap: 6px; }
  .recipient-row { display: flex; gap: 8px; align-items: center; }
  .recipient-row input { flex: 1; }
  .add-recipient { background: none; border: 1.5px dashed var(--border); color: var(--text-light); border-radius: 8px; padding: 7px; width: 100%; cursor: pointer; font-family: 'Heebo', sans-serif; font-size: 13px; transition: all 0.15s; margin-top: 6px; }
  .add-recipient:hover { border-color: var(--primary-light); color: var(--primary); }
  .remove-recipient { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 16px; padding: 4px; }

  /* ── Update Status ── */
  .status-options { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .status-option {
    flex: 1; min-width: 120px; padding: 12px; border-radius: 10px;
    border: 2px solid var(--border); cursor: pointer; text-align: center;
    transition: all 0.15s; font-family: 'Heebo', sans-serif;
  }
  .status-option:hover { border-color: var(--primary-light); }
  .status-option.selected-open { border-color: var(--danger); background: #fdecea; }
  .status-option.selected-progress { border-color: var(--warning); background: #fef3e2; }
  .status-option.selected-closed { border-color: var(--success); background: #e8f8f0; }
  .status-option-icon { font-size: 22px; margin-bottom: 4px; }
  .status-option-label { font-size: 13px; font-weight: 600; }

  /* ── Empty ── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text-light); }
  .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state-text { font-size: 15px; font-weight: 500; }

  /* ── Score badge ── */
  .score-badge { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; font-weight: 800; font-size: 15px; }
  .score-excellent { background: #e8f8f0; color: var(--success); }
  .score-good { background: #fef3e2; color: var(--warning); }
  .score-mid { background: #fff0e0; color: #d35400; }
  .score-bad { background: #fdecea; color: var(--danger); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .header-title { font-size: 15px; }
    .form-row { grid-template-columns: 1fr; }
    .findings-table th:nth-child(4), .findings-table td:nth-child(4),
    .findings-table th:nth-child(5), .findings-table td:nth-child(5) { display: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; background: #e8eef7; color: var(--primary); margin: 1px; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; margin-top: 18px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: white; padding: 12px 24px;
    border-radius: 10px; font-size: 14px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 999;
    animation: fadeInUp 0.3s ease; display: none;
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo">
    <div class="logo-icon">FC</div>
    <div>
      <div class="header-title">מערכת ניהול ממצאים</div>
      <div class="header-subtitle">Flying Cargo – שירותים לוגיסטיים</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 ייצוא CSV</button>
    <button class="btn btn-outline btn-sm" onclick="sendReminders()" style="background:#fff3cd;color:#856404;border-color:#ffc107;">🔔 שלח תזכורות</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('kobo-import-input').click()">📂 יבוא מ-Kobo</button>
    <input type="file" id="kobo-import-input" accept=".xlsx,.xls" style="display:none" onchange="importFromKobo(this)">
    <button class="btn btn-primary" onclick="openNewFinding()">+ ממצא חדש</button>
  </div>
</div>

<!-- Main -->
<div class="container">

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card total">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">סה"כ ממצאים</div>
    </div>
    <div class="stat-card open">
      <div class="stat-num" id="stat-open">0</div>
      <div class="stat-label">פתוחים</div>
    </div>
    <div class="stat-card in-progress">
      <div class="stat-num" id="stat-progress">0</div>
      <div class="stat-label">בטיפול</div>
    </div>
    <div class="stat-card closed">
      <div class="stat-num" id="stat-closed">0</div>
      <div class="stat-label">סגורים</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-title">📋 רשימת ממצאים</div>
    <input class="search-box" type="text" placeholder="חיפוש..." id="search-input" oninput="renderTable()">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">הכל</button>
      <button class="filter-btn" data-filter="open" onclick="setFilter('open',this)">פתוח</button>
      <button class="filter-btn" data-filter="progress" onclick="setFilter('progress',this)">בטיפול</button>
      <button class="filter-btn" data-filter="closed" onclick="setFilter('closed',this)">סגור</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div style="overflow-x:auto;">
      <table class="findings-table">
        <thead>
          <tr>
            <th>#</th>
            <th>אתר / מיזם</th>
            <th>ממצא</th>
            <th>חומרה</th>
            <th>סוקר</th>
            <th>תאריך</th>
            <th>סטטוס</th>
            <th>ציון</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="findings-tbody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-state-icon">📭</div>
      <div class="empty-state-text">אין ממצאים להצגה</div>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════
     MODAL: ממצא חדש
══════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">➕ הוספת ממצא חדש</div>
      <button class="modal-close" onclick="closeModal('modal-new')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">אתר / מרלוג *</label>
          <input class="form-control" id="nf-site" placeholder="לדוגמה: עין כרמל">
        </div>
        <div class="form-group">
          <label class="form-label">מיזם / מחלקה *</label>
          <input class="form-control" id="nf-project" placeholder="לדוגמה: פיליפס">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">שם הסוקר *</label>
          <input class="form-control" id="nf-inspector" placeholder="שם מלא">
        </div>
        <div class="form-group">
          <label class="form-label">תאריך הסיור *</label>
          <input class="form-control" type="date" id="nf-date">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">תיאור הממצא *</label>
        <textarea class="form-control" id="nf-desc" rows="3" placeholder="פרט את הממצא שנמצא..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">מיקום הכשל</label>
          <input class="form-control" id="nf-location" placeholder="לדוגמה: Receiving">
        </div>
        <div class="form-group">
          <label class="form-label">חומרת הממצא *</label>
          <select class="form-control" id="nf-severity">
            <option value="">-- בחר --</option>
            <option value="1">קל (1) – 3.03 נק'</option>
            <option value="2">בינוני (2) – 6.06 נק'</option>
            <option value="3">קשה (3) – 9.09 נק'</option>
            <option value="r">הערה חוזרת – 9.09 נק'</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">ציון הסיור (0–100)</label>
        <input class="form-control" id="nf-score" type="number" min="0" max="100" placeholder="לדוגמה: 84.85">
      </div>

      <div class="divider"></div>
      <div class="section-title">📧 שליחה לנמענים לטיפול</div>
      <div class="recipients-list" id="recipients-list">
        <div class="recipient-row">
          <input class="form-control" type="email" placeholder="כתובת מייל לטיפול" value="">
          <button class="remove-recipient" onclick="removeRecipient(this)">×</button>
        </div>
      </div>
      <button class="add-recipient" onclick="addRecipient()">+ הוסף נמען</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveFinding()">💾 שמור ושלח</button>
      <button class="btn btn-outline" style="background:#f0f4f8;color:var(--text);" onclick="closeModal('modal-new')">ביטול</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MODAL: פרטי ממצא + עדכון סטטוס
══════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">פרטי ממצא</div>
      <button class="modal-close" onclick="closeModal('modal-detail')">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer" id="detail-footer"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MODAL: עדכון סטטוס (לנמען)
══════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-update">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🔄 עדכון סטטוס ממצא</div>
      <button class="modal-close" onclick="closeModal('modal-update')">×</button>
    </div>
    <div class="modal-body" id="update-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveStatusUpdate()">✅ שמור עדכון</button>
      <button class="btn btn-outline" style="background:#f0f4f8;color:var(--text);" onclick="closeModal('modal-update')">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
let findings = JSON.parse(localStorage.getItem('fc_findings') || '[]');
let currentFilter = 'all';
let currentFindingId = null;
let selectedStatus = null;

function save() {
  localStorage.setItem('fc_findings', JSON.stringify(findings));
}

function genId() {
  return 'F' + Date.now().toString(36).toUpperCase();
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function showToast(msg, duration=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, duration);
}

// RENDER
// ══════════════════════════════════════════
function updateStats() {
  const total = findings.length;
  const open = findings.filter(f => f.status === 'open').length;
  const progress = findings.filter(f => f.status === 'progress').length;
  const closed = findings.filter(f => f.status === 'closed').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-open').textContent = open;
  document.getElementById('stat-progress').textContent = progress;
  document.getElementById('stat-closed').textContent = closed;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function getFiltered() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  return findings.filter(f => {
    const matchFilter = currentFilter === 'all' || f.status === currentFilter;
    const matchSearch = !q ||
      (f.site||'').toLowerCase().includes(q) ||
      (f.project||'').toLowerCase().includes(q) ||
      (f.desc||'').toLowerCase().includes(q) ||
      (f.inspector||'').toLowerCase().includes(q) ||
      (f.location||'').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function sevBadge(s) {
  if (s==='1') return '<span class="sev sev-1">קל</span>';
  if (s==='2') return '<span class="sev sev-2">בינוני</span>';
  if (s==='3') return '<span class="sev sev-3">קשה</span>';
  if (s==='r') return '<span class="sev sev-r">חוזרת</span>';
  return '—';
}

function statusBadge(s) {
  if (s==='open')     return '<span class="badge badge-open"><span class="badge-dot"></span>פתוח</span>';
  if (s==='progress') return '<span class="badge badge-progress"><span class="badge-dot"></span>בטיפול</span>';
  if (s==='closed')   return '<span class="badge badge-closed"><span class="badge-dot"></span>סגור</span>';
  return '—';
}

function scoreBadge(score) {
  if (score === null || score === undefined || score === '') return '—';
  const n = parseFloat(score);
  let cls = 'score-bad';
  if (n >= 90) cls = 'score-excellent';
  else if (n >= 80) cls = 'score-good';
  else if (n >= 70) cls = 'score-mid';
  return `<div class="score-badge ${cls}">${n.toFixed(0)}</div>`;
}

function renderTable() {
  updateStats();
  const data = getFiltered();
  const tbody = document.getElementById('findings-tbody');
  const empty = document.getElementById('empty-state');

  if (data.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = data.map((f, i) => `
    <tr>
      <td style="font-weight:700;color:var(--primary-light);">${f.id}</td>
      <td>
        <div style="font-weight:600;">${f.site||'—'}</div>
        <div style="font-size:11px;color:var(--text-light);">${f.project||''}</div>
      </td>
      <td style="max-width:200px;">
        <div style="font-weight:500;">${(f.desc||'').substring(0,60)}${f.desc&&f.desc.length>60?'...':''}</div>
        ${f.location ? `<div style="font-size:11px;color:var(--text-light);">📍 ${f.location}</div>` : ''}
      </td>
      <td>${sevBadge(f.severity)}</td>
      <td style="font-size:12px;">${f.inspector||'—'}<br><span style="color:var(--text-light);">${formatDate(f.date)}</span></td>
      <td>${formatDate(f.date)}</td>
      <td>${statusBadge(f.status)}</td>
      <td>${scoreBadge(f.score)}</td>
      <td>
        <div class="actions">
          <button class="btn btn-info btn-sm" onclick="openDetail('${f.id}')">👁 פרטים</button>
          <button class="btn btn-warning btn-sm" onclick="openUpdate('${f.id}')">🔄</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function removeRecipient(btn) {
  const list = document.getElementById('recipients-list');
  if (list.children.length > 1) btn.parentElement.remove();

function saveFinding() {
  const site = document.getElementById('nf-site').value.trim();
  const project = document.getElementById('nf-project').value.trim();
  const inspector = document.getElementById('nf-inspector').value.trim();
  const date = document.getElementById('nf-date').value;
  const desc = document.getElementById('nf-desc').value.trim();
  const severity = document.getElementById('nf-severity').value;
  const score = document.getElementById('nf-score').value;
  const location = document.getElementById('nf-location').value.trim();

  if (!site || !inspector || !desc || !severity) {
    showToast('⚠️ נא למלא את כל השדות החובה');
    return;
  }

  const recipients = Array.from(document.querySelectorAll('#recipients-list input'))
    .map(i => i.value.trim()).filter(v => v);

  const finding = {
    id: genId(),
    site, project, inspector, date, desc, severity, score, location,
    recipients,
    status: 'open',
    timeline: [{ status: 'open', note: 'ממצא נפתח', date: new Date().toLocaleString('he-IL'), by: inspector }],
    createdAt: new Date().toISOString()
  };

  findings.unshift(finding);
  save();
  closeModal('modal-new');
  renderTable();

  // Send real emails via EmailJS
  if (recipients.length > 0) {
    sendFindingEmails(finding);
  } else {
    showToast('✅ ממצא נשמר בהצלחה');
  }
}

async function sendFindingEmails(finding) {
  const EMAILJS_SERVICE  = 'service_j252uce';
  const EMAILJS_TEMPLATE = 'template_j4gf816';

  const updateLink = `${window.location.origin}${window.location.pathname}?update=${finding.id}`;

  let sent = 0;
  let failed = 0;

  showToast(`📧 שולח מיילים ל-${finding.recipients.length} נמענים...`);

  for (const email of finding.recipients) {
    try {
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        email:       email,
        site:        finding.site        || '—',
        project:     finding.project     || '—',
        inspector:   finding.inspector   || '—',
        date:        formatDate(finding.date),
        location:    finding.location    || '—',
        severity:    sevLabel(finding.severity),
        score:       finding.score       || '—',
        desc:        finding.desc        || '—',
        update_link: updateLink,
      });
      sent++;
    } catch(err) {
      console.error('EmailJS error:', err);
      failed++;
    }
  }

  if (failed === 0) {
    showToast(`✅ ממצא נשמר ונשלח ל-${sent} נמענים בהצלחה`);
  } else {
    showToast(`⚠️ נשלח ל-${sent}, נכשל ל-${failed} נמענים`);
  }
}

async function sendClosureEmail(finding, by, note) {
  const EMAILJS_SERVICE  = 'service_j252uce';
  const EMAILJS_TEMPLATE = 'template_j4gf816';

  // Notify the inspector that the finding was closed
  if (!finding.inspector) return;
  try {
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
      email:       finding.recipients && finding.recipients[0] ? finding.recipients[0] : '',
      site:        finding.site     || '—',
      project:     finding.project  || '—',
      inspector:   finding.inspector|| '—',
      date:        formatDate(finding.date),
      location:    finding.location || '—',
      severity:    sevLabel(finding.severity),
      score:       finding.score    || '—',
      desc:        `✅ הממצא טופל וסגור.\nמטפל: ${by||'לא צוין'}\nהערה: ${note||'—'}\n\nממצא מקורי:\n${finding.desc||'—'}`,
      update_link: 'הממצא סגור – אין צורך בפעולה נוספת',
    });
  } catch(err) {
    console.error('Closure email error:', err);
  }
}

function sevLabel(s) {
  if (s==='1') return 'קל (1)';
  if (s==='2') return 'בינוני (2)';
  if (s==='3') return 'קשה (3)';
  if (s==='r') return 'הערה חוזרת';
  return s;
}

// SEND REMINDERS

async function sendReminders() {
  const EMAILJS_SERVICE  = 'service_j252uce';
  const EMAILJS_TEMPLATE = 'template_j4gf816';
  const DAYS_THRESHOLD = 7;

  const now = new Date();
  const overdue = findings.filter(f => {
    if (f.status === 'closed') return false;
    if (!f.recipients || f.recipients.length === 0) return false;
    const created = new Date(f.createdAt || f.date);
    const diffDays = Math.floor((now - created) / (1000 * 60 * 60 * 24));
    return diffDays >= DAYS_THRESHOLD;
  });

  if (overdue.length === 0) {
    showToast('✅ אין ממצאים פתוחים מעל 7 ימים');
    return;
  }

  const confirm_msg = `נמצאו ${overdue.length} ממצאים פתוחים מעל 7 ימים.
לשלוח תזכורת לכל הנמענים?`;
  if (!confirm(confirm_msg)) return;

  showToast(`📧 שולח תזכורות ל-${overdue.length} ממצאים...`);

  let sent = 0;
  let failed = 0;

  for (const f of overdue) {
    const updateLink = `${window.location.origin}${window.location.pathname}?update=${f.id}`;
    const created = new Date(f.createdAt || f.date);
    const diffDays = Math.floor((now - created) / (1000 * 60 * 60 * 24));

    for (const email of f.recipients) {
      try {
        await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
          email:       email,
          site:        f.site      || '—',
          project:     f.project   || '—',
          inspector:   f.inspector || '—',
          date:        formatDate(f.date),
          location:    f.location  || '—',
          severity:    sevLabel(f.severity),
          score:       f.score     || '—',
          desc:        `⏰ תזכורת – ממצא זה פתוח כבר ${diffDays} ימים ומחכה לטיפול!

${f.desc||'—'}`,
          update_link: updateLink,
        });
        sent++;
      } catch(err) {
        console.error('Reminder error:', err);
        failed++;
      }
    }
  }

  if (failed === 0) {
    showToast(`✅ נשלחו ${sent} תזכורות בהצלחה`);
  } else {
    showToast(`⚠️ נשלח ${sent}, נכשל ${failed}`);
  }
}

function exportCSV() {
  const headers = ['מזהה','אתר','מיזם','סוקר','תאריך','ממצא','מיקום','חומרה','ציון','סטטוס','נמענים'];
  const rows = findings.map(f => [
    f.id, f.site, f.project, f.inspector, f.date,
    (f.desc||'').replace(/,/g,''), f.location, sevLabel(f.severity),
    f.score, {open:'פתוח',progress:'בטיפול',closed:'סגור'}[f.status],
    (f.recipients||[]).join('; ')
  ]);
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${c||''}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `ממצאים_${today()}.csv`;
  a.click();
  showToast('📥 קובץ CSV הורד בהצלחה');
}

function importFromKobo(input) {
  const file = input.files[0];
  if (!file) return;

  // Load SheetJS
  if (typeof XLSX === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => parseKoboFile(file);
    document.head.appendChild(script);
  } else {
    parseKoboFile(file);
  }
  input.value = ''; // reset input
}

function parseKoboFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (rows.length === 0) {
        showToast('⚠️ הקובץ ריק או לא תקין'); return;
      }

      // Map KoboToolbox column names to our fields
      // Supports both Hebrew and English column names exported by Kobo
      const colMap = {
        site:      ['site', 'אתר / מרלוג', 'אתר/מרלוג', 'אתר'],
        project:   ['project', 'מיזם / מחלקה', 'מיזם/מחלקה', 'מיזם'],
        inspector: ['inspector', 'שם הסוקר', 'סוקר'],
        date:      ['tour_date', 'תאריך ושעת הסיור', 'תאריך'],
        score:     ['final_score', 'ציון סופי', 'ציון'],
      };

      // Question status columns (q1_status ... q11_status)
      const qLabels = [
        'אריזות פתוחות / קרועות', 'משטחים מזוהים', 'מרווח אחסנה',
        'ניקיון מחסן', 'תקינות משטחים', 'דלתות סגורות',
        'הפרדת מוצרים', 'פגי תוקף', 'סטנדים נופלים',
        'מדיניות שולחן נקי', 'תקינות תאורה בגובה'
      ];

      function getCol(row, names) {
        for (const n of names) {
          if (row[n] !== undefined && row[n] !== '') return String(row[n]);
        }
        return '';
      }

      let imported = 0;
      let skipped = 0;

      rows.forEach(row => {
        const site      = getCol(row, colMap.site);
        const project   = getCol(row, colMap.project);
        const inspector = getCol(row, colMap.inspector);
        const dateRaw   = getCol(row, colMap.date);
        const score     = getCol(row, colMap.score);

        // Parse date
        let date = '';
        if (dateRaw) {
          // Kobo exports as ISO or Excel serial
          if (dateRaw.includes('T') || dateRaw.includes('-')) {
            date = dateRaw.split('T')[0];
          } else if (!isNaN(Number(dateRaw))) {
            // Excel serial date
            const d = XLSX.SSF.parse_date_code(Number(dateRaw));
            date = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
          } else {
            date = dateRaw.substring(0, 10);
          }
        }
        if (!date) date = today();

        // Extract severity map from Kobo severity columns
        const sevMap = { 'kal':'1', 'beinoni':'2', 'kasha':'3', 'chozeret':'r' };

        // Find all non-takin questions
        for (let i = 1; i <= 11; i++) {
          const statusKey   = `q${i}_status`;
          const severityKey = `q${i}_severity`;
          const descKey     = `q${i}_desc`;
          const locKey      = `finding_location`;

          const statusVal   = getCol(row, [statusKey]);
          const severityVal = getCol(row, [severityKey]);

          // Only create finding if status is lo_takin
          if (statusVal === 'lo_takin' || statusVal === 'לא תקין') {
            const desc     = getCol(row, [descKey]) || qLabels[i-1];
            const location = getCol(row, [locKey]);
            const severity = sevMap[severityVal] || '1';

            // Check for duplicate (same site+project+date+desc)
            const isDup = findings.some(f =>
              f.site === site && f.date === date && f.desc === desc
            );
            if (isDup) { skipped++; continue; }

            findings.unshift({
              id: genId(),
              site, project, inspector, date, score,
              desc: desc || qLabels[i-1],
              location, severity,
              recipients: [],
              status: 'open',
              timeline: [{ status: 'open', note: 'יובא מ-KoboToolbox', date: new Date().toLocaleString('he-IL'), by: inspector }],
              createdAt: new Date().toISOString()
            });
            imported++;
          }
        }

        // Also check general findings fields (non-question-based)
        const generalDesc = getCol(row, ['finding_desc', 'תיאור הכשל']);
        if (generalDesc && statusMap !== 'takin') {
          const isDup = findings.some(f => f.site === site && f.date === date && f.desc === generalDesc);
          if (!isDup) {
            findings.unshift({
              id: genId(),
              site, project, inspector, date, score,
              desc: generalDesc,
              location: getCol(row, ['finding_location','מיקום הכשל']),
              severity: '1',
              recipients: [],
              status: 'open',
              timeline: [{ status: 'open', note: 'יובא מ-KoboToolbox', date: new Date().toLocaleString('he-IL'), by: inspector }],
              createdAt: new Date().toISOString()
            });
            imported++;
          }
        }
      });

      save();
      renderTable();

      if (imported === 0 && skipped === 0) {
        showToast('⚠️ לא נמצאו ממצאים "לא תקין" בקובץ');
      } else {
        showToast(`✅ יובאו ${imported} ממצאים${skipped ? ` (${skipped} כפולים דולגו)` : ''}`);
      }

    } catch(err) {
      console.error(err);
      showToast('❌ שגיאה בקריאת הקובץ – ודא שזהו קובץ XLS מ-KoboToolbox');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Init
renderTable();
</script>
</body>
</html>
